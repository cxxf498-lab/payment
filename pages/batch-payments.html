<!-- 批次管理页面 -->
<div class="batch-payments-container">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">批量代付记录</h1>
      <p class="page-subtitle">查看和管理批量代付批次</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="window.location.hash='payment'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        新建批量代付
      </button>
    </div>
  </div>

  <!-- 筛选区域 -->
  <div class="glass-card filter-card">
    <div class="filter-row">
      <div class="filter-group">
        <label class="filter-label">状态</label>
        <select id="statusFilter" class="select">
          <option value="">全部状态</option>
          <option value="processing">处理中</option>
          <option value="completed">已完成</option>
          <option value="partial_success">部分成功</option>
          <option value="failed">失败</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">开始日期</label>
        <input type="date" id="startDate" class="input">
      </div>

      <div class="filter-group">
        <label class="filter-label">结束日期</label>
        <input type="date" id="endDate" class="input">
      </div>

      <div class="filter-group">
        <label class="filter-label">搜索</label>
        <input type="text" id="searchInput" class="input" placeholder="批次ID...">
      </div>

      <div class="filter-actions">
        <button class="btn btn-secondary" onclick="resetBatchFilters()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2V8H15.5"></path>
            <path d="M2.5 22V16H8.5"></path>
            <path d="M2 11.5C2.24 8.53 3.64 5.77 5.93 3.83C8.22 1.89 11.18 0.93 14.16 1.15C17.14 1.37 19.91 2.75 21.86 5"></path>
            <path d="M22 12.5C21.76 15.47 20.36 18.23 18.07 20.17C15.78 22.11 12.82 23.07 9.84 22.85C6.86 22.63 4.09 21.25 2.14 19"></path>
          </svg>
          重置
        </button>
        <button class="btn btn-primary" onclick="searchBatches()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21L16.65 16.65"></path>
          </svg>
          搜索
        </button>
      </div>
    </div>
  </div>

  <!-- 批次列表 -->
  <div class="glass-card table-card">
    <div id="batchesTable">
      <!-- 表格将通过JS动态生成 -->
    </div>
  </div>

  <!-- 分页 -->
  <div id="batchesPagination"></div>
</div>
